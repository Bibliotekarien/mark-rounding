[project]
name = "markrounding"
version = "0.1.0"
description = "Följ kappseglingar live genom märkesrundningar rapporterade av tävlingskommittén"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pyjwt>=2.8",
    "beautifulsoup4>=4.12",
]

[project.scripts]
markrounding = "markrounding.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["markrounding"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["I"]

[tool.ruff.lint.isort]
force-single-line = true
