name: tests

# Fristående, avsiktligt. mark-rounding är ett öppet repo, och de övriga
# repona i orgen anropar i stället delade workflows i det privata
# bibliotekarien-platform. Här står hela definitionerna på plats, av två skäl:
#
#   1. Läsbarhet utifrån. En `uses:`-rad mot ett privat repo pekar in i något en
#      utomstående bidragsgivare inte kan läsa. CI:n blir omöjlig att förstå
#      eller reproducera för den som inte redan har åtkomst — precis motsatsen
#      till vad man vill i ett projekt man bjuder in folk till.
#   2. Ett publikt repos körningsloggar är publika. Att anropa ett privat
#      workflow därifrån läcker dess struktur, och GitHub tillåter det troligen
#      inte alls.
#
# Priset är att den här filen innehåller två kopior som båda måste hållas i
# synk med bibliotekarien-platform när originalen ändras:
#
#   - jobbet `pytest`   ← .github/workflows/python-tests.yml
#   - jobbet `frontend` ← .github/workflows/frontend-tests.yml
#
# Originalen är kanoniska; jobben här är kopior.

on:
  pull_request:
  # Inte redundant mot pull_request: merge-resultatet kan skilja sig från
  # PR-huvudet, och det är merge-resultatet som deployas.
  push:
    branches: [main]

# Testkörningen skriver ingenting och behöver inga secrets. Det senare är
# avsiktligt: fork-PR:er får inga secrets, så jobbet fungerar oförändrat på dem.
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # SHA-pinnade, inte flytande taggar — en action kör med jobbets egna
      # rättigheter. Taggkommentaren är läshjälp; SHA:n är det som gäller.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Lämna inte kvar checkout-tokenet i .git/config där senare steg
          # (eller kod ur PR:en) kan använda det.
          persist-credentials: false

      - name: Installera uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # --locked failar om uv.lock inte matchar pyproject.toml. Det är en grind,
      # inte en olägenhet: den fångar en ändrad dependency som inte låsts om,
      # vilket annars ger olika beroenden i CI och i produktion.
      - name: Installera beroenden exakt enligt lockfilen
        run: uv sync --locked

      - name: pytest
        run: uv run --no-sync pytest -q

  # Samma node och samma bygge som Dockerfilens frontend-steg, så att ett
  # trasigt produktionsbygge syns i PR:en och inte först vid deploy (TS 7
  # slank igenom room40 för att bara pytest kördes). Kopia av
  # frontend-tests.yml, se filhuvudet.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node-majoren följer Dockerfilens `FROM node:24-alpine`.
      - name: Installera Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci failar om lockfilen inte matchar package.json — samma grind som
      # `uv sync --locked` ovan.
      - name: Installera beroenden exakt enligt lockfilen
        run: npm ci

      - name: Lint
        run: npm run lint

      # Produktionsbygget, samma kommando som i Dockerfilen.
      - name: Bygg
        run: npm run build
