version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # A PR for ghcr.io/techarohq/anubis is the signal to run the Anubis checklist
  # in bibliotekarien-platform/edge/ANUBIS.md (edge CSP/blob worker, robots
  # template, policy check) in all apps at once. Do not merge a lone image
  # bump. No ignore: every new version should produce a reminder.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
