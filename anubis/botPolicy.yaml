# Anubis-policy: /api/* och .well-known släpps igenom orört (XHR och
# ACME-liknande klienter kan inte lösa en browser-PoW); vanliga webbläsare
# får en challenge på HTML-trafiken. Speglar tOPAC:s policy.
bots:
  - name: api-passthrough
    path_regex: ^/api/.*$
    action: ALLOW
  - name: well-known
    path_regex: ^/\.well-known/.*$
    action: ALLOW
  - name: generic-browser
    user_agent_regex: Mozilla
    action: CHALLENGE
